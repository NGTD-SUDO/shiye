name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 跑测试
        working-directory: backend
        env:
          SHIYE_DEV_MODE: "true"                     # CI 用开发模式跳过生产密钥强校验
          SHIYE_DATABASE_URL: "sqlite:///./ci_test.db"
          SHIYE_OCR: "rapidocr"                      # 不依赖外部 OCR 服务
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: 依赖
        working-directory: frontend
        run: flutter pub get
      - name: 静态检查
        working-directory: frontend
        run: flutter analyze --no-fatal-infos
      - name: 单元测试
        working-directory: frontend
        run: flutter test
