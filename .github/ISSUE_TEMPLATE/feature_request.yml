name: 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提之前建议先看一眼 README 的「明确不做」清单：不做 App 内手写、不做协作、不做笔记社交。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 请描述场景，而不是直接给方案（便于判断该不该进路线图）
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法（可选）
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      options: [只影响我自己用, 需要改后端, 需要改数据结构, 需要改客户端交互]
    validations:
      required: false
